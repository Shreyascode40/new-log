# Render deploys the API workspace only. Keep the service root at the repository
# root because the npm workspace and shared Prisma schema live there.
services:
  - type: web
    name: be-logbook-api
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run api:build
    startCommand: npm run api:start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - prisma/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: API_INTERNAL_SECRET
        sync: false
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: WEB_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_SMTP_HOST
        sync: false
      - key: BREVO_SMTP_PORT
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REQUIRE_EMAIL_VERIFICATION
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false
